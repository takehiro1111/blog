<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <style>
      text{font-family:'Hiragino Sans','Noto Sans JP','Helvetica Neue',Arial,sans-serif;fill:#0f172a;font-size:14px}
      .h{font-size:20px;font-weight:700}
      .g{font-size:15px;font-weight:700;fill:#334155}
      .s{font-size:12px;fill:#475569}
      .b{font-weight:700}
      .box{fill:#fff;stroke:#334155;stroke-width:1.5}
      .grp{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 5}
      .lb{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arb)}
      .ln{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#ar)}
      .lr{stroke:#dc2626;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .note{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="30" y="40" class="h">Terraform CI の認証経路: GitHub を信頼するロールはハブの 1 か所だけ</text>

  <!-- adopted -->
  <text x="30" y="80" class="g" fill="#166534">採用: ハブで認証し、provider の assume_role でスポークに入る</text>
  <rect x="30" y="110" width="180" height="80" rx="8" class="box"/>
  <text x="120" y="138" text-anchor="middle" class="b">GitHub Actions</text>
  <text x="120" y="158" text-anchor="middle" class="s">Digger CE（PR で plan、</text>
  <text x="120" y="174" text-anchor="middle" class="s">main マージで apply）</text>

  <rect x="270" y="95" width="300" height="110" rx="12" class="grp"/>
  <text x="286" y="118" class="g">ハブアカウント</text>
  <rect x="290" y="128" width="260" height="64" rx="8" class="box" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="152" text-anchor="middle" class="b">github-actions-infra-hub</text>
  <text x="420" y="172" text-anchor="middle" class="s">GitHub を信頼する唯一のロール（OIDC）</text>
  <path d="M210,150 L286,160" class="lb"/>
  <text x="237" y="124" text-anchor="middle" class="s" fill="#2563eb">OIDC</text>

  <rect x="640" y="95" width="300" height="200" rx="12" class="grp"/>
  <text x="656" y="118" class="g">TEST 環境アカウント ×8（スポーク）</text>
  <rect x="660" y="128" width="260" height="46" rx="8" class="box"/>
  <text x="790" y="147" text-anchor="middle" class="b">infra-hub-deployer</text>
  <text x="790" y="165" text-anchor="middle" class="s">権限: infra-hub-operator の管理だけ</text>
  <rect x="660" y="184" width="260" height="46" rx="8" class="box"/>
  <text x="790" y="203" text-anchor="middle" class="b">infra-hub-deployer</text>
  <text x="790" y="221" text-anchor="middle" class="s">権限: infra-hub-operator の管理だけ</text>
  <text x="790" y="262" text-anchor="middle" class="s">… 各アカウントに 1 つ（ローカルで 1 回 apply して用意）</text>
  <path d="M550,150 L656,151" class="lb"/>
  <path d="M550,170 L656,207" class="lb"/>
  <text x="661" y="77" text-anchor="middle" class="s" fill="#2563eb">provider の assume_role</text>

  <rect x="990" y="128" width="180" height="102" rx="8" class="box"/>
  <text x="1080" y="156" text-anchor="middle" class="b">infra-hub-operator</text>
  <text x="1080" y="176" text-anchor="middle" class="s">アプリ実行時に Lambda が</text>
  <text x="1080" y="192" text-anchor="middle" class="s">AssumeRole するロール</text>
  <text x="1080" y="212" text-anchor="middle" class="s">を作成・更新する</text>
  <path d="M920,151 L986,170" class="ln"/>
  <path d="M920,207 L986,190" class="ln"/>

  <!-- divider -->
  <line x1="30" y1="320" x2="1170" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- rejected -->
  <g opacity="0.75">
  <text x="30" y="352" class="g" fill="#991b1b">不採用: Actions 側（Digger の aws_role_to_assume）で各アカウントに直接入る</text>
  <rect x="30" y="380" width="180" height="80" rx="8" class="box"/>
  <text x="120" y="408" text-anchor="middle" class="b">GitHub Actions</text>
  <text x="120" y="428" text-anchor="middle" class="s">Digger CE</text>

  <rect x="290" y="372" width="260" height="40" rx="8" class="box" stroke="#dc2626"/>
  <text x="420" y="397" text-anchor="middle" class="s">ハブ: OIDC プロバイダ + GitHub 信頼ロール</text>
  <rect x="290" y="420" width="260" height="40" rx="8" class="box" stroke="#dc2626"/>
  <text x="420" y="445" text-anchor="middle" class="s">TEST 1: OIDC プロバイダ + GitHub 信頼ロール</text>
  <rect x="290" y="468" width="260" height="40" rx="8" class="box" stroke="#dc2626"/>
  <text x="420" y="493" text-anchor="middle" class="s">TEST 2: OIDC プロバイダ + GitHub 信頼ロール</text>
  <text x="420" y="528" text-anchor="middle" class="b" fill="#991b1b">… 合計 9 か所に GitHub を信頼するロール</text>
  <path d="M210,410 L286,392" class="lr"/>
  <path d="M210,420 L286,440" class="lr"/>
  <path d="M210,430 L286,488" class="lr"/>
  </g>

  <rect x="580" y="372" width="590" height="170" rx="8" class="note"/>
  <text x="598" y="400" class="b" fill="#92400e">決め手</text>
  <text x="598" y="426" class="s" fill="#92400e">・GitHub を信頼する場所をハブの 1 か所に保てる</text>
  <text x="598" y="448" class="s" fill="#92400e">・アプリ実行時の経路（ハブの Lambda → スポーク）と同じハブ &amp; スポークになる</text>
  <text x="598" y="470" class="s" fill="#92400e">・Digger の aws_role_to_assume は GitHub の OIDC トークンで対象ロールを直接引き受ける実装で、</text>
  <text x="598" y="488" class="s" fill="#92400e">　ハブのロールを経由できない</text>
  <text x="598" y="510" class="s" fill="#92400e">・代わりに、ハブ CI ロールの到達範囲が全スポークに広がる。</text>
  <text x="598" y="528" class="s" fill="#92400e">　infra-hub-deployer の権限を infra-hub-operator の管理に限定して抑える</text>
</svg>
